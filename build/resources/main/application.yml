server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: platform-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:file:.env[.properties]

#  data:
#    mongodb:
#      uri:

  graphql:
    schema:
      locations: classpath:graphql/**
      file-extensions: .graphqls,.gqls
    path: /graphql
    graphiql:
      enabled: true
      path: /graphiql

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect


logging:
  level:
    root: INFO
    com.mgforge.MGForge: DEBUG
    org.hibernate.orm.jdbc.bind: trace

app:
  jwt:
    issuer: "platform-api"
    secret-base64: ${JWT_SECRET_BASE64}
    access-token-minutes: ${JWT_ACCESS_MIN}