server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: platform-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  graphql:
    schema:
      locations: classpath:graphql/**/
      file-extensions: .graphqls,.gqls
    graphiql:
      enabled: true
      path: /graphiql

  datasource:
    url: ${DB_URL}
